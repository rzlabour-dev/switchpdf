<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Clean PDF Document Icon -->
  <g transform="translate(5, 10)">
    <!-- Document body -->
    <rect x="0" y="0" width="35" height="45" rx="3" fill="#dc2626" stroke="#b91c1c" stroke-width="1"/>
    <!-- Document lines -->
    <line x1="6" y1="14" x2="24" y2="14" stroke="white" stroke-width="2"/>
    <line x1="6" y1="20" x2="29" y2="20" stroke="white" stroke-width="2"/>
    <line x1="6" y1="26" x2="26" y2="26" stroke="white" stroke-width="2"/>
    <line x1="6" y1="32" x2="22" y2="32" stroke="white" stroke-width="2"/>
    <!-- Corner fold -->
    <polygon points="23,0 35,0 35,12" fill="#991b1b"/>
  </g>

  <!-- Simple Switch Arrow -->
  <g transform="translate(50, 22)">
    <!-- Arrow body -->
    <rect x="0" y="4" width="25" height="6" rx="3" fill="#2563eb"/>
    <!-- Arrow head -->
    <polygon points="25,1 35,7 25,13" fill="#2563eb"/>
    <!-- Arrow tail -->
    <rect x="-6" y="5" width="8" height="4" rx="2" fill="#1d4ed8"/>
  </g>

  <!-- Clean Text -->
  <text x="95" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">Switch</text>
  <text x="95" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#dc2626">PDF</text>

  <!-- Simple .io badge -->
  <g transform="translate(160, 18)">
    <circle cx="10" cy="10" r="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
    <text x="10" y="14" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#374151" text-anchor="middle">.io</text>
  </g>
</svg>