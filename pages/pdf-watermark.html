<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Watermark | Smart Export</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
</head>
<body>
    <div id="navigation-container" aria-label="Main navigation"></div>
    
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-stamp"></i>
                </div>
                <h1>PDF Watermark</h1>
            </div>
            <p class="tagline">Add text or image watermarks to your PDF documents. Protect your content and add branding.</p>
        </header>

        <main>
            <div class="app-card">
                <div class="card-header">
                    <h2>Upload & Add Watermark</h2>
                    <p>Drag and drop or click to select your PDF file</p>
                </div>
                
                <div class="card-body">
                    <div class="upload-area" id="dropArea">
                        <div class="upload-icon">
                            <i class="fas fa-cloud-upload-alt"></i>
                        </div>
                        <p class="upload-text">Drag & Drop your PDF file here</p>
                        <p class="upload-subtext">or click to browse files</p>
                        <button class="btn" id="browseBtn">Browse PDF Files</button>
                        <input type="file" id="fileInput" class="file-input" accept=".pdf">
                    </div>

                    <div id="watermarkOptions" style="display: none;">
                        <div id="fileInfo" class="file-info-display">
                            <p><strong>Pages:</strong> <span id="pageCount">-</span></p>
                        </div>

                        <div class="option-group">
                            <div class="option">
                                <label for="watermarkType">Watermark Type:</label>
                                <select id="watermarkType">
                                    <option value="text">Text Watermark</option>
                                    <option value="image">Image Watermark</option>
                                </select>
                            </div>
                            
                            <div id="textOptions">
                                <div class="option">
                                    <label for="watermarkText">Watermark Text:</label>
                                    <input type="text" id="watermarkText" placeholder="CONFIDENTIAL" class="form-input" value="CONFIDENTIAL">
                                </div>
                                
                                <div class="option">
                                    <label for="textColor">Text Color:</label>
                                    <input type="color" id="textColor" value="#ff0000" class="form-input">
                                </div>
                                
                                <div class="option">
                                    <label for="fontSize">Font Size:</label>
                                    <select id="fontSize">
                                        <option value="12">Small (12pt)</option>
                                        <option value="24" selected>Medium (24pt)</option>
                                        <option value="36">Large (36pt)</option>
                                        <option value="48">Extra Large (48pt)</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div id="imageOptions" style="display: none;">
                                <div class="option">
                                    <label for="watermarkImage">Watermark Image:</label>
                                    <input type="file" id="watermarkImage" accept="image/*" class="form-input">
                                </div>
                                
                                <div class="option">
                                    <label for="imageOpacity">Image Opacity:</label>
                                    <input type="range" id="imageOpacity" min="0.1" max="1" step="0.1" value="0.5" class="form-input">
                                    <span id="opacityValue">50%</span>
                                </div>
                            </div>
                            
                            <div class="option">
                                <label for="position">Position:</label>
                                <select id="position">
                                    <option value="center">Center</option>
                                    <option value="diagonal">Diagonal</option>
                                    <option value="top-left">Top Left</option>
                                    <option value="top-right">Top Right</option>
                                    <option value="bottom-left">Bottom Left</option>
                                    <option value="bottom-right">Bottom Right</option>
                                </select>
                            </div>
                            
                            <div class="option">
                                <label for="pageSelection">Apply to:</label>
                                <select id="pageSelection">
                                    <option value="all">All Pages</option>
                                    <option value="first">First Page Only</option>
                                    <option value="range">Page Range</option>
                                </select>
                            </div>
                            
                            <div id="rangeInput" class="option" style="display: none;">
                                <label for="pageRange">Page Range (e.g., 1-3,5):</label>
                                <input type="text" id="pageRange" placeholder="1-3,5" class="form-input">
                            </div>
                        </div>
                        
                        <button class="btn" id="addWatermarkBtn">Add Watermark</button>
                    </div>

                    <div id="progressArea" style="display: none;">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <p id="progressText">Adding watermark...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <footer id="footer-container"></footer>

    <!-- External Libraries -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <!-- Load components -->
    <script>
        // Load navigation
        fetch('../components/navigation.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navigation-container').innerHTML = data;
            });
        
        // Load footer
        fetch('../components/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-container').innerHTML = data;
            });
    </script>
    
    <!-- Main JavaScript -->
    <script src="../js/pdf-watermark.js" defer></script>
    
    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
