<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4606840502684829"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extract Text from PDF Online | SwitchPDF</title>
    <meta name="description" content="Extract text from PDF files online for free. Copy or export readable PDF text directly in your browser without uploading the file.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://switchpdf.io/pdf-text-extractor">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
        <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/images/favicon-64.png">
    <link rel="icon" type="image/png" sizes="128x128" href="/images/favicon-128.png">
    <link rel="icon" type="image/png" sizes="256x256" href="/images/favicon-256.png">
    <link rel="shortcut icon" href="/images/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon-256.png">
    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <div id="navigation-container" aria-label="Main navigation"></div>
    
    <div class="container">
        <header>
            <div class="logo">
                <img class="logo-image" src="/images/switchpdf-logo.svg" alt="SwitchPDF.io">
                <h1>PDF Text Extractor</h1>
            </div>
            <p class="tagline">Extract text content from PDF files. Convert PDF text to editable formats for easy copying and editing.</p>
            <button class="btn btn-success" id="uploadCta" style="margin-top: 16px; font-size: 1.05rem;">Upload PDF</button>
        </header>

        <main>
            <div class="app-card">
                <div class="card-header">
                    <h2>Upload & Extract Text</h2>
                    <p>Drag and drop or click to select your PDF file</p>
                </div>
                
                <div class="card-body">
                    <div class="upload-area" id="dropArea">
                        <div class="upload-icon">
                            <i class="fas fa-cloud-upload-alt"></i>
                        </div>
                        <p class="upload-text">Drag & Drop your PDF file here</p>
                        <p class="upload-subtext">or click to browse files</p>
                        <button class="btn" id="browseBtn">Browse PDF Files</button>
                        <input type="file" id="fileInput" class="file-input" accept=".pdf">
                    </div>

                    <div id="extractOptions" style="display: none;">
                        <div id="fileInfo" class="file-info-display">
                            <p><strong>Pages:</strong> <span id="pageCount">-</span></p>
                        </div>

                        <div class="option-group">
                            <div class="option">
                                <label for="outputFormat">Output Format:</label>
                                <select id="outputFormat">
                                    <option value="text">Plain Text (.txt)</option>
                                    <option value="html">HTML (.html)</option>
                                    <option value="json">JSON (.json)</option>
                                </select>
                            </div>
                            
                            <div class="option">
                                <label for="pageSelection">Extract from:</label>
                                <select id="pageSelection">
                                    <option value="all">All Pages</option>
                                    <option value="range">Page Range</option>
                                </select>
                            </div>
                            
                            <div id="rangeInput" class="option" style="display: none;">
                                <label for="pageRange">Page Range (e.g., 1-3,5):</label>
                                <input type="text" id="pageRange" placeholder="1-3,5" class="form-input">
                            </div>
                        </div>
                        
                        <button class="btn" id="extractBtn">Extract Text</button>
                    </div>

                    <div id="textOutput" style="display: none;">
                        <div class="option-group">
                            <h3>Extracted Text:</h3>
                            <div class="text-output-container">
                                <textarea id="extractedText" readonly class="text-output"></textarea>
                            </div>
                            <div class="output-actions">
                                <button class="btn" id="copyBtn">Copy to Clipboard</button>
                                <button class="btn" id="downloadBtn">Download File</button>
                            </div>
                        </div>
                    </div>

                    <div id="progressArea" style="display: none;">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <p id="progressText">Extracting text...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <footer id="footer-container"></footer>

    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <!-- Load components -->
    <script>
        // Load navigation
        fetch('../components/navigation.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navigation-container').innerHTML = data;
            });
        
        // Load footer
        fetch('../components/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-container').innerHTML = data;
            });
    </script>
    
    <!-- Main JavaScript -->
    <script src="../js/pdf-text-extractor.js" defer></script>
</body>
</html>
