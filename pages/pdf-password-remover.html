<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4606840502684829"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Password Remover | Smart Export</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg+xml" href="../images/switchpdf-logo.svg">
    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <div id="navigation-container" aria-label="Main navigation"></div>
    
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-unlock"></i>
                </div>
                <h1>PDF Password Remover</h1>
            </div>
            <p class="tagline">Remove password protection from PDF files. Unlock PDFs that require passwords to open or edit.</p>
        </header>

        <main>
            <div class="app-card">
                <div class="card-header">
                    <h2>Upload & Unlock PDF</h2>
                    <p>Drag and drop or click to select your password-protected PDF file</p>
                </div>
                
                <div class="card-body">
                    <div class="upload-area" id="dropArea">
                        <div class="upload-icon">
                            <i class="fas fa-cloud-upload-alt"></i>
                        </div>
                        <p class="upload-text">Drag & Drop your PDF file here</p>
                        <p class="upload-subtext">or click to browse files</p>
                        <button class="btn" id="browseBtn">Browse PDF Files</button>
                        <input type="file" id="fileInput" class="file-input" accept=".pdf">
                    </div>

                    <div id="passwordPrompt" style="display: none;">
                        <div class="option-group">
                            <div class="option">
                                <label for="password">Enter PDF Password:</label>
                                <input type="password" id="password" placeholder="Enter password" class="form-input">
                            </div>
                            <button class="btn" id="unlockBtn">Unlock PDF</button>
                        </div>
                    </div>

                    <div id="progressArea" style="display: none;">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <p id="progressText">Unlocking PDF...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <footer id="footer-container"></footer>

    <!-- External Libraries -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <!-- Load components -->
    <script>
        // Load navigation
        fetch('../components/navigation.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navigation-container').innerHTML = data;
            });
        
        // Load footer
        fetch('../components/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-container').innerHTML = data;
            });
    </script>
    
    <!-- Main JavaScript -->
    <script src="../js/pdf-password-remover.js" defer></script>
</body>
</html>
