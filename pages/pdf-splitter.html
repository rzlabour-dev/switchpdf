<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4606840502684829"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split PDF Online Free | SwitchPDF</title>
    <meta name="description" content="Split a PDF into separate files online for free. Select the pages you need and process your PDF directly in your browser.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.switchpdf.io/pdf-splitter">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
        <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/images/favicon-64.png">
    <link rel="icon" type="image/png" sizes="128x128" href="/images/favicon-128.png">
    <link rel="icon" type="image/png" sizes="256x256" href="/images/favicon-256.png">
    <link rel="shortcut icon" href="/images/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon-256.png">
    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <!-- Navigation will be loaded here -->
    <div id="navigation-container" aria-label="Main navigation"></div>

    <div class="container">
        <header>
            <div class="logo">
                <img class="logo-image" src="/images/switchpdf-logo.svg" alt="SwitchPDF.io">
                <h1>PDF Splitter</h1>
            </div>
            <p class="tagline">Split PDF files into multiple documents. Extract pages, split by ranges, or divide large files.</p>
            <button class="btn btn-success" id="uploadCta" style="margin-top: 16px; font-size: 1.05rem;">Upload PDF</button>
        </header>

        <main>
            <div class="app-card">
                <div class="card-header">
                    <h2>Upload & Split PDF</h2>
                    <p>Drag and drop or click to select your PDF file</p>
                </div>
                
                <div class="card-body">
                    <div class="upload-area" id="dropArea">
                        <div class="upload-icon">
                            <i class="fas fa-cloud-upload-alt"></i>
                        </div>
                        <p class="upload-text">Drag & Drop your PDF file here</p>
                        <p class="upload-subtext">or click to browse files</p>
                        <button class="btn" id="browseBtn">Browse PDF Files</button>
                        <input type="file" id="fileInput" class="file-input" accept=".pdf">
                    </div>

                    <div id="splitOptions" style="display: none;">
                        <div class="option-group">
                            <div class="option">
                                <label for="splitMethod">Split Method:</label>
                                <select id="splitMethod">
                                    <option value="range">Split by Page Range</option>
                                    <option value="individual">Extract Individual Pages</option>
                                    <option value="size">Split by File Size</option>
                                </select>
                            </div>
                            
                            <div id="rangeOptions" class="option">
                                <label for="pageRanges">Page Ranges (e.g., 1-3,5,7-9):</label>
                                <input type="text" id="pageRanges" placeholder="1-3,5,7-9" class="form-input">
                            </div>
                            
                            <div id="sizeOptions" class="option" style="display: none;">
                                <label for="maxSize">Maximum Size per File (MB):</label>
                                <input type="number" id="maxSize" min="0.1" step="0.1" value="5" class="form-input">
                            </div>
                        </div>
                        
                        <button class="btn" id="splitBtn">Split PDF</button>
                    </div>

                    <div id="progressArea" style="display: none;">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <p id="progressText">Splitting PDF...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <footer id="footer-container"></footer>

    <!-- External Libraries -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <!-- Load components -->
    <script>
        // Load navigation
        fetch('../components/navigation.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navigation-container').innerHTML = data;
            });
        
        // Load footer
        fetch('../components/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-container').innerHTML = data;
            });
    </script>
    
    <!-- Main JavaScript -->
    <script src="../js/pdf-splitter.js" defer></script>
    
    
</body>
</html>
