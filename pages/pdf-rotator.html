<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4606840502684829"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Rotator | Smart Export</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
        <!-- Favicon for switchpdf.io - minimalist controller-inspired logo -->
            <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/images/favicon-64.png">
    <link rel="icon" type="image/png" sizes="128x128" href="/images/favicon-128.png">
    <link rel="icon" type="image/png" sizes="256x256" href="/images/favicon-256.png">
    <link rel="shortcut icon" href="/images/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon-256.png">
    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <!-- Navigation will be loaded here -->
    <div id="navigation-container" aria-label="Main navigation"></div>

    <div class="container">
        <header>
            <div class="logo">
                <img class="logo-image" src="/images/switchpdf-logo.svg" alt="SwitchPDF.io">
                <h1>PDF Rotator</h1>
            </div>
            <p class="tagline">Rotate PDF pages to the correct orientation. Fix upside-down or sideways documents.</p>
            <button class="btn btn-success" id="uploadCta" style="margin-top: 16px; font-size: 1.05rem;">Upload PDF</button>
        </header>

        <main>
            <div class="app-card">
                <div class="card-header">
                    <h2>Upload & Rotate PDF</h2>
                    <p>Drag and drop or click to select your PDF file</p>
                </div>
                
                <div class="card-body">
                    <div class="upload-area" id="dropArea">
                        <div class="upload-icon">
                            <i class="fas fa-cloud-upload-alt"></i>
                        </div>
                        <p class="upload-text">Drag & Drop your PDF file here</p>
                        <p class="upload-subtext">or click to browse files</p>
                        <button class="btn" id="browseBtn">Browse PDF Files</button>
                        <input type="file" id="fileInput" class="file-input" accept=".pdf">
                    </div>

                    <div id="rotateOptions" style="display: none;">
                        <div id="fileInfo" class="file-info-display">
                            <p><strong>Pages:</strong> <span id="pageCount">-</span></p>
                        </div>

                        <div class="option-group">
                            <div class="option">
                                <label for="rotationAngle">Rotation Angle:</label>
                                <select id="rotationAngle">
                                    <option value="90">90Â° Clockwise</option>
                                    <option value="180">180Â° (Upside Down)</option>
                                    <option value="270">270Â° Counter-Clockwise</option>
                                </select>
                            </div>
                            
                            <div class="option">
                                <label for="pageSelection">Apply to:</label>
                                <select id="pageSelection">
                                    <option value="all">All Pages</option>
                                    <option value="range">Page Range</option>
                                    <option value="individual">Individual Pages</option>
                                </select>
                            </div>
                            
                            <div id="rangeInput" class="option" style="display: none;">
                                <label for="pageRange">Page Range (e.g., 1-3,5,7-9):</label>
                                <input type="text" id="pageRange" placeholder="1-3,5,7-9" class="form-input">
                            </div>
                            
                            <div id="individualInput" class="option" style="display: none;">
                                <label for="individualPages">Page Numbers (comma-separated):</label>
                                <input type="text" id="individualPages" placeholder="1,3,5" class="form-input">
                            </div>
                        </div>
                        
                        <button class="btn" id="rotateBtn">Rotate PDF</button>
                    </div>

                    <div id="progressArea" style="display: none;">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <p id="progressText">Rotating PDF...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <footer id="footer-container"></footer>

    <!-- External Libraries -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <!-- Load components -->
    <script>
        // Load navigation
        fetch('../components/navigation.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navigation-container').innerHTML = data;
            });
        
        // Load footer
        fetch('../components/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-container').innerHTML = data;
            });
    </script>
    
    <!-- Main JavaScript -->
    <script src="../js/pdf-rotator.js" defer></script>
    
    
</body>
</html>
